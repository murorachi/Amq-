name: V82.85.4 engineering acceptance

on:
  push:
    branches:
      - "v82.85.*"
      - "v82.86.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned TypeScript parser for AST contracts
        run: npm install --global typescript@5.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source fingerprints and deterministic V82.82 build
        run: python tools/verify.py
      - name: Run native-storage, custom-list and backup contract tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/unit/native_storage_reload_snapshot_contract.test.cjs
          node tests/unit/custom_list_crud_reload_contract.test.cjs
          node tests/unit/custom_list_normalization_contract.test.cjs
          node tests/unit/emq_selection_contract.test.cjs
      - name: Run all module contracts referenced by closeout matrix
        run: python tests/unit/run_module_contracts.py
      - name: Audit checkpoint package completeness and reproducibility
        run: python tests/unit/package_checkpoint_contract.py
      - name: Reconcile modularization closeout matrix with source manifest
        run: python tests/unit/modularization_closeout_matrix_contract.py
      - name: Validate row-by-row modularization closeout disposition
        run: python tests/unit/modularization_closeout_disposition_contract.py
      - name: Validate structural issue inventory
        run: python tests/unit/structural_issue_inventory_contract.py
      - name: Validate full engineering backlog
        run: python tests/unit/engineering_backlog_contract.py
  browser-native-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run real-origin native storage and custom-list acceptance
        run: python tests/browser/native_storage_custom_lists_acceptance.py --html dist/amq_learning_tool_v82_82.html
      - name: Run isolated custom-list invalid-scope and UI regression suite
        run: python tests/browser/custom_lists_ui_acceptance.py --html dist/amq_learning_tool_v82_82.html
      - name: Run real-origin browser acceptance for IndexedDB and quiz input
        run: python tests/browser/real_origin_acceptance_localhost.py --html dist/amq_learning_tool_v82_82.html
      - name: Run quiz suggestion and input integration acceptance
        run: python tests/browser/quiz_suggestions_integration.py --html dist/amq_learning_tool_v82_82.html
      - name: Run quiz answer and playback lifecycle acceptance
        run: python tests/browser/quiz_answer_playback_lifecycle.py --html dist/amq_learning_tool_v82_82.html
      - name: Run multiplayer room, phase, live-draft and reconnect acceptance
        run: python tests/browser/multiplayer_lifecycle_acceptance.py --html dist/amq_learning_tool_v82_82.html
