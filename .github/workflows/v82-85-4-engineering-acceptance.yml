name: V82.85.30 audio volume default fix acceptance

on:
  push:
    branches:
      - "v82.85.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source fingerprints and deterministic V82.82 build
        run: python tools/verify.py
      - name: Test reverse source inventory contract
        run: python tests/unit/source_inventory_completeness_contract.py
      - name: Test multiplayer checked-value helper deduplication contract
        run: node tests/unit/multiplayer_checked_values_dedup_contract.test.cjs
      - name: Test multiplayer suggestion cache invalidation dedup contract
        run: node tests/unit/multiplayer_suggestion_cache_invalidation_dedup_contract.test.cjs
      - name: Test multiplayer room pool bounds validation dedup contract
        run: node tests/unit/multiplayer_room_pool_bounds_validation_contract.test.cjs
      - name: Test multiplayer next-audio state reset dedup contract
        run: node tests/unit/multiplayer_next_audio_state_reset_dedup_contract.test.cjs
      - name: Test multiplayer audio failure handler dedup contract
        run: node tests/unit/multiplayer_audio_failure_callback_contract.test.cjs
      - name: Test checkpoint package completeness contract
        run: python tests/unit/package_checkpoint_contract.py
      - name: Build and verify checkpoint source package
        shell: bash
        run: |
          set -euo pipefail
          python tools/package_checkpoint.py "$RUNNER_TEMP/AMQ_V82_85_30_AUDIO_VOLUME_DEFAULT_FIX_01.zip"
          python tools/package_checkpoint.py "$RUNNER_TEMP/AMQ_V82_85_30_AUDIO_VOLUME_DEFAULT_FIX_01_REPEAT.zip"
          first="$(sha256sum "$RUNNER_TEMP/AMQ_V82_85_30_AUDIO_VOLUME_DEFAULT_FIX_01.zip" | cut -d ' ' -f1)"
          second="$(sha256sum "$RUNNER_TEMP/AMQ_V82_85_30_AUDIO_VOLUME_DEFAULT_FIX_01_REPEAT.zip" | cut -d ' ' -f1)"
          test "$first" = "$second"
          echo "PASS deterministic package SHA-256: $first"
      - name: Upload verified source package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AMQ_V82_85_30_SOURCE_PACKAGE_AUDIO_VOLUME_DEFAULT_FIX_01
          path: |
            ${{ runner.temp }}/AMQ_V82_85_30_AUDIO_VOLUME_DEFAULT_FIX_01.zip
            ${{ runner.temp }}/AMQ_V82_85_30_AUDIO_VOLUME_DEFAULT_FIX_01.zip.sha256
          if-no-files-found: error
      - name: Guard acceptance runner artifact targets
        run: python tests/unit/run_all_checks_config_contract.py
      - name: Build versioned V82.85.30 standalone candidate
        run: python tools/build.py dist/amq_learning_tool_v82_85_30.html
      - name: Upload versioned standalone candidate
        uses: actions/upload-artifact@v4
        with:
          name: AMQ_V82_85_30_STANDALONE_HTML
          path: dist/amq_learning_tool_v82_85_30.html
          if-no-files-found: error
      - name: Run answer-normalization extraction contract
        run: node tests/unit/quiz_answer_target_normalization_contract.test.cjs
      - name: Run quiz target-value extraction contract
        run: node tests/unit/quiz_target_value_extraction_contract.test.cjs
      - name: Run quiz practice metadata getter extraction contract
        run: node tests/unit/quiz_practice_meta_getter_extraction_contract.test.cjs
      - name: Run quiz answer alias tooltip text extraction contract
        run: node tests/unit/quiz_answer_alias_tooltip_text_extraction_contract.test.cjs
      - name: Run quiz volume default regression contract
        run: node tests/unit/quiz_volume_default_contract.test.cjs
      - name: Run native-storage, custom-list and backup contract tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/unit/native_storage_reload_snapshot_contract.test.cjs
          node tests/unit/custom_list_crud_reload_contract.test.cjs
          node tests/unit/amq_custom_list_validation.test.cjs
          node tests/unit/backup_restore_contract.test.cjs
  browser-native-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build versioned V82.85.30 standalone candidate
        run: python tools/build.py dist/amq_learning_tool_v82_85_30.html
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run real-origin native storage and custom-list acceptance
        run: python tests/browser/native_storage_custom_lists_acceptance.py --html dist/amq_learning_tool_v82_85_30.html
      - name: Run isolated custom-list invalid-scope and UI regression suite
        run: python tests/browser/custom_lists_ui_acceptance.py --html dist/amq_learning_tool_v82_85_30.html
      - name: Run real-origin browser acceptance for IndexedDB and quiz input
        run: python tests/browser/real_origin_acceptance_localhost.py --html dist/amq_learning_tool_v82_85_30.html
      - name: Run quiz suggestion and input integration acceptance
        run: python tests/browser/quiz_suggestions_integration.py --html dist/amq_learning_tool_v82_85_30.html
      - name: Run quiz answer and playback lifecycle acceptance
        run: python tests/browser/quiz_answer_playback_lifecycle.py --html dist/amq_learning_tool_v82_85_30.html
      - name: Install PulseAudio and ALSA output tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins alsa-utils
      - name: Run real browser audio decode and output acceptance
        env:
          DEBUG: pw:browser
        run: xvfb-run -a python tests/browser/real_audio_output_acceptance.py --html dist/amq_learning_tool_v82_85_30.html
      - name: Run multiplayer room, phase, live-draft and reconnect acceptance
        if: always()
        run: python tests/browser/multiplayer_lifecycle_acceptance.py --html dist/amq_learning_tool_v82_85_30.html
  browser-firefox-responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build versioned V82.85.30 standalone candidate
        run: python tools/build.py dist/amq_learning_tool_v82_85_30.html
      - name: Install Playwright Firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Run Firefox responsive and quiz UI smoke acceptance
        run: python tests/browser/firefox_responsive_smoke_acceptance.py --html dist/amq_learning_tool_v82_85_30.html
