name: Proto22 osu-inspired UI and regression acceptance
on:
  push:
    branches:
      - v82.85.30-proto22-osu-reference-fidelity-01
permissions:
  contents: write
jobs:
  accept-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve previously accepted Proto19 base artifact
        uses: actions/download-artifact@v4
        with:
          name: proto18-native-origin-acceptance
          run-id: 39433563820
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: base-artifact
      - name: Reconstruct Proto22
        run: |
          set -euo pipefail
          find base-artifact -maxdepth 3 -type f -printf '%p %s bytes\n'
          BASE="$(find base-artifact -name candidate.html -type f | head -n1)"
          test -n "$BASE"
          cp "$BASE" candidate.html
          python engineering/apply_proto20.py
          python - <<'PY'
          from pathlib import Path
          p=Path("candidate.html")
          s=p.read_text(encoding="utf-8")
          # ui-v22.css is already appended by apply_proto20.py; remove only the stray literal escape.
          s=s.replace('\\n<style id="amq-home-legacy-sections-guard-v851">','<style id="amq-home-legacy-sections-guard-v851">')
          s=s.replace('</style>\\n','</style>')
          if s.endswith("\\\\n"):
            s=s[:-3]
          elif s.endswith("\\n"):
            s=s[:-2]
          p.write_text(s,encoding="utf-8")
          assert "amq-osu-reference-fidelity-v22" in s
          print("Reference CSS present once; trailing literal escape cleaned: PASS")
          PY
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path("candidate.html").read_text(encoding="utf-8")
          class IDs(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]
            def handle_starttag(self,tag,attrs):
              self.ids.extend(v for k,v in attrs if k=="id")
          parser=IDs(); parser.feed(s)
          assert len(parser.ids)==len(set(parser.ids)), "duplicate HTML ids"
          ids=parser.ids
          assert "amq-osu-reference-fidelity-v22" in s
          assert 'data-home-action="multiplayer"' in s
          assert "function runAction(a)" in s
          print(f"HTML parse and IDs: PASS ({len(ids)} unique ids)")
          PY
          sha256sum candidate.html | tee candidate.sha256
      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Run desktop/mobile/native storage and navigation acceptance
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/amq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:8765/candidate.html -o /dev/null && break || sleep 1; done
          python tests/proto22_acceptance.py
      - name: Publish isolated candidate and engineering records
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist engineering/proto22-acceptance
          cp candidate.html dist/amq_learning_tool_v82_85_30_workspace_proto22.html
          cp candidate.sha256 dist/amq_learning_tool_v82_85_30_workspace_proto22.html.sha256
          cat > engineering/proto22-acceptance/BASELINE.md <<'EOF'
          # BASELINE — Proto22
          - Base: previously browser-accepted Proto19 artifact from workflow run 39433563820.
          - Production V82.82 and read-only V82.85.30 are unchanged.
          - Proto22 is an isolated UI candidate and does not replace production.
          EOF
          cat > engineering/proto22-acceptance/CURRENT_STATUS.md <<EOF
          # CURRENT STATUS — Proto22
          - Candidate: dist/amq_learning_tool_v82_85_30_workspace_proto22.html
          - Bytes: $(stat -c %s candidate.html)
          - SHA-256: $(sha256sum candidate.html | cut -d ' ' -f 1)
          - Acceptance: passed current workflow checks.
          - Production promotion: not performed.
          EOF
          cat > engineering/proto22-acceptance/NEXT_TASK.md <<'EOF'
          # NEXT TASK
          1. Run existing quiz/audio and multiplayer lifecycle regression suites.
          2. Confirm screenshots against the agreed osu! Stable reference, not merely layout assertions.
          3. Do not promote until full existing-feature regression results are recorded.
          EOF
          cat > engineering/proto22-acceptance/TEST_REPORT.md <<EOF
          # TEST REPORT — Proto22
          - HTML parse and unique IDs: PASS.
          - Desktop 1440x900 screenshot and menu geometry assertions: PASS if workflow succeeds.
          - Mobile 390x844 screenshot and overflow assertion: PASS if workflow succeeds.
          - Native localStorage/sessionStorage/IndexedDB and reload persistence: PASS if workflow succeeds.
          - Homepage navigation, settings layer, multiplayer route entry, console/page errors: PASS if workflow succeeds.
          - Quiz/audio real playback, answer lifecycle, multiplayer room lifecycle: NOT RUN in this UI-focused workflow.
          - Run: https://github.com/murorachi/Amq-/actions/runs/${{ github.run_id }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/amq_learning_tool_v82_85_30_workspace_proto22.html dist/amq_learning_tool_v82_85_30_workspace_proto22.html.sha256 engineering/proto22-acceptance
          git commit -m "Publish Proto22 osu-inspired UI candidate and acceptance records"
          git push origin HEAD:v82.85.30-proto22-osu-reference-fidelity-01
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto22-ui-acceptance-evidence
          path: |
            candidate.html
            candidate.sha256
            acceptance-report.json
            proto22-desktop.png
            proto22-mobile.png
          if-no-files-found: ignore
          retention-days: 14
