
name: Verify AMQ V82.64 Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    name: Download and verify V82.64 ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Download V82.64 release ZIP
        env:
          ASSET_URL: https://github.com/murorachi/Amq-/releases/download/AMQ/AMQ_V82_64__E5_80_99_E9_A1_8C_E6_B1_A0_E8_88_87_E6_AD_B7_E5_8F_B2_E8_B3_87_E6_96_99_E5_B1_A4_E6_95_B4_E9_A0_93_E6_AA_A2_E6_9F_A5_E9_BB_9E.zip
          EXPECTED_SHA256: 260b2ab31d82b37b8af8df6e080fd547b780bb9204e15f87acaced92d153c2b7
        run: |
          set -euo pipefail

          echo "Downloading AMQ V82.64 package..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ASSET_URL" \
            --output package.zip

          if [ ! -s package.zip ]; then
            echo "::error::Downloaded package is missing or empty"
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum package.zip | cut -d ' ' -f 1)"
          ACTUAL_SIZE="$(stat -c %s package.zip)"

          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $ACTUAL_SHA256"
          echo "Package size:     $ACTUAL_SIZE bytes"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::SHA-256 mismatch. The downloaded file does not match the expected release asset."
            exit 1
          fi

          echo "SHA-256 verification: PASS"

          {
            echo "## AMQ V82.64 Package Verification"
            echo
            echo "- Download: PASS"
            echo "- SHA-256: PASS"
            echo "- File size: ${ACTUAL_SIZE} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check ZIP signature and integrity
        run: |
          set -euo pipefail

          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path("package.zip")

          if not path.is_file():
              raise SystemExit("ZIP file does not exist")

          if path.stat().st_size == 0:
              raise SystemExit("ZIP file is empty")

          with path.open("rb") as file:
              signature = file.read(4)

          if signature != b"PK\x03\x04":
              raise SystemExit(
                  f"Unexpected ZIP signature: {signature!r}"
              )

          print("ZIP signature: PASS")

          try:
              with zipfile.ZipFile(path, "r") as archive:
                  entries = archive.infolist()

                  if not entries:
                      raise SystemExit("ZIP archive contains no entries")

                  bad_file = archive.testzip()

                  if bad_file is not None:
                      raise SystemExit(
                          f"ZIP integrity failure in file: {bad_file}"
                      )

                  print("ZIP integrity: PASS")
                  print(f"File count: {len(entries)}")
                  print()
                  print("Files in archive:")

                  for entry in entries:
                      print(
                          f"{entry.file_size:>12} bytes  "
                          f"{entry.filename}"
                      )

          except zipfile.BadZipFile as exc:
              raise SystemExit(f"Invalid ZIP archive: {exc}") from exc

          print()
          print("All ZIP checks passed.")
          PY

      - name: Publish final verification summary
        if: success()
        run: |
          {
            echo
            echo "- ZIP signature: PASS"
            echo "- ZIP integrity: PASS"
            echo "- Package modified: NO"
            echo
            echo "The original release package was downloaded and verified."
            echo "This workflow does not modify project HTML files."
            echo "This workflow does not generate a new project version."
          } >> "$GITHUB_STEP_SUMMARY"
