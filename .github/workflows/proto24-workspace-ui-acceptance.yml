name: Proto25 stage 9 responsive UI acceptance
on:
  push:
    branches:
      - v82.85.30-proto25-ui-refactor-work-01
permissions:
  contents: write
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct candidate with reviewed Proto24 layout
        run: |
          set -euo pipefail
          cp amq_learning_tool_v82_85_30_workspace_proto17.html candidate.html
          python - <<'PY'
          from pathlib import Path
          p=Path("candidate.html"); s=p.read_text(encoding="utf-8")
          replacements=[
            ("查看清單與學習資料','learningCenter'", "查看清單與學習資料','watchlist'"),
            ("if(!clickHome('learningCenter'))return;\n   const mode=a==='practiceExplore'?'explore':'weak';", "window.__aniSetHomeMenuOpenV846?.(false);window.__aniNavigateApp?.('practice');\n    const mode=a==='practiceExplore'?'explore':'weak';"),
            ("if(a==='practice-self'){\n   if(!clickHome('learningCenter'))return;", "if(a==='practice-self'){\n    window.__aniSetHomeMenuOpenV846?.(false);window.__aniNavigateApp?.('practice');"),
            ("if(a==='practice-srs'){\n   if(!clickHome('learningCenter'))return;", "if(a==='practice-srs'){\n    window.__aniSetHomeMenuOpenV846?.(false);window.__aniNavigateApp?.('practice');"),
            ("function refreshBatchScope(){const source=$('#batchScopeSummaryV844'),target=$('#wsBatchScopeText');if(!target)return;target.textContent=source?.textContent?.trim()||'尚未取得選取範圍。請先在圖鑑選取作品。'}", "function refreshBatchScope(){const source=$('#batchScopeSummaryV844'),target=$('#wsBatchScopeText');if(!target)return;const next=source?.textContent?.trim()||'尚未取得選取範圍。請先在圖鑑選取作品。';if(target.textContent!==next)target.textContent=next}")
          ]
          for old,new in replacements:
            n=s.count(old)
            if n != 1: raise SystemExit(f"Expected one match, got {n}: {old[:100]!r}")
            s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          assert "if(target.textContent!==next)target.textContent=next" in s
          play_menu = """
          <script id="proto25-stable-play-menu">
          (() => {
            const homeMenu = document.getElementById("homeMenu");
            if (!homeMenu || document.getElementById("amqStablePlayShade")) return;
            const shade = document.createElement("div");
            shade.id = "amqStablePlayShade";
            shade.hidden = true;
            shade.innerHTML = '<section id="amqStablePlayPanel" role="dialog" aria-modal="true" aria-labelledby="amqStablePlayTitle"><p id="amqStablePlayEyebrow">OSU!STABLE · PLAY</p><h2 id="amqStablePlayTitle">Play</h2><div id="amqStablePlayChoices"><button id="amqStableSinglePlayer" type="button">Single Player</button><button id="amqStableMultiplayer" type="button">Multiplayer</button><button id="amqStablePlayClose" type="button">Back</button></div><p id="amqStablePlayNotice">Multiplayer opens the existing AMQ room setup. Server connection and room readiness are verified in that screen.</p></section>';
            document.body.appendChild(shade);
            const single = document.getElementById("amqStableSinglePlayer");
            const multi = document.getElementById("amqStableMultiplayer");
            const back = document.getElementById("amqStablePlayClose");
            const close = () => { shade.hidden = true; homeMenu.querySelector('[data-home-action="quiz"]')?.focus(); };
            homeMenu.addEventListener("click", event => {
              const button = event.target.closest('[data-home-action="quiz"]');
              if (!button) return;
              event.preventDefault();
              event.stopImmediatePropagation();
              shade.hidden = false;
              single.focus();
            }, true);
            single.addEventListener("click", () => {
              shade.hidden = true;
              window.__aniSetHomeMenuOpenV846?.(false);
              window.__aniNavigateApp?.("quiz");
            });
            multi.addEventListener("click", () => {
              shade.hidden = true;
              window.__aniSetHomeMenuOpenV846?.(false);
              window.__aniNavigateApp?.("multiplayer");
            });
            back.addEventListener("click", close);
            shade.addEventListener("click", event => { if (event.target === shade) close(); });
            shade.addEventListener("keydown", event => {
              if (event.key === "Escape") { event.preventDefault(); close(); return; }
              if (event.key !== "Tab") return;
              const focusables = [single, back];
              const index = focusables.indexOf(document.activeElement);
              if (event.shiftKey && index <= 0) { event.preventDefault(); focusables[focusables.length - 1].focus(); }
              else if (!event.shiftKey && index === focusables.length - 1) { event.preventDefault(); focusables[0].focus(); }
            });
          })();
          </script>
          """
          s += play_menu
          print("Source compatibility fixes and Stable Play menu injection: PASS")
          PY
          cat engineering/proto24/amq-osu-home-composition.css >> candidate.html
          cat engineering/proto24/amq-workspace-osu-composition.css >> candidate.html
          sha256sum candidate.html | tee candidate.sha256
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static HTML, duplicate-ID, and inline JavaScript checks
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.ids=[]
                  self.scripts=[]
                  self.current=None
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if attrs.get("id"): self.ids.append(attrs["id"])
                  if tag.lower()=="script":
                      self.current={"attrs":attrs,"body":""}
              def handle_data(self, data):
                  if self.current is not None: self.current["body"]+=data
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.current is not None:
                      self.scripts.append(self.current);self.current=None

          source=Path("candidate.html").read_text(encoding="utf-8")
          parser=Audit();parser.feed(source);parser.close()
          assert source.lstrip().lower().startswith("<!doctype html"), "missing HTML doctype"
          duplicates=sorted({x for x in parser.ids if parser.ids.count(x)>1})
          if duplicates: raise SystemExit(f"duplicate IDs: {duplicates[:20]}")
          checked=0
          with tempfile.TemporaryDirectory() as td:
              for index, item in enumerate(parser.scripts):
                  attrs=item["attrs"]
                  if attrs.get("src"): continue
                  kind=attrs.get("type","").strip().lower()
                  if kind and kind not in ("text/javascript","application/javascript","module"): continue
                  body=item["body"].strip()
                  if not body: continue
                  path=Path(td)/f"inline-{index}.js"
                  path.write_text(body,encoding="utf-8")
                  result=subprocess.run(["node","--check",str(path)],text=True,capture_output=True)
                  if result.returncode:
                      raise SystemExit(f"inline script {index} syntax error:\n{result.stderr}")
                  checked+=1
          print(f"PASS: HTML parsed; {len(parser.ids)} IDs unique; {checked} inline JavaScript blocks syntax-checked.")
          PY
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run browser acceptance
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/amq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:8765/candidate.html -o /dev/null && break || sleep 1; done
          python tests/proto24_workspace_acceptance.py
      - name: Upload screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto25-stage09-ui-acceptance
          path: |
            candidate.html
            candidate.sha256
            acceptance-report.json
            proto24-desktop.png
            proto24-mobile.png
            proto24-learning-workspace.png
            proto24-analysis-workspace.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish accepted candidate and engineering records to isolated branch
        if: success()
        env:
          TARGET_BRANCH: v82.85.30-proto25-ui-refactor-stage-09
        run: |
          set -euo pipefail
          mkdir -p dist engineering/proto24-acceptance
          cp candidate.html dist/amq_learning_tool_v82_85_30_workspace_proto25_stage09.html
          cp candidate.sha256 dist/amq_learning_tool_v82_85_30_workspace_proto25_stage09.html.sha256
          # Preserve the pinned baseline and next-task records from the source branch.
          # Candidate fingerprint is recorded in the test report and manifest.
          cat > engineering/proto24-acceptance/TEST_REPORT.md <<EOF
          # TEST REPORT — Proto25 Stage 9
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Candidate: dist/amq_learning_tool_v82_85_30_workspace_proto25_stage09.html
          - Size: $(stat -c %s candidate.html) bytes
          - SHA-256: $(sha256sum candidate.html | cut -d ' ' -f 1)
          - Browser acceptance: PASS (workflow only publishes this report after the test step succeeds).
          - Homepage routes, native storage, mobile overflow, and no browser exceptions/console errors: PASS only if all browser assertions succeed.
          - Play menu Single Player / Multiplayer / Back routes: PASS only if route assertions succeed; multiplayer server connectivity is not tested.
          - Catalog, single-player quiz, Settings panel, workspace palette, and reduced-motion assertions: PASS only if their respective browser assertions succeed.
          - Screenshots: proto24-desktop.png, proto24-mobile.png, proto24-learning-workspace.png, proto24-analysis-workspace.png in the workflow artifact.
          - Actual audio output, full quiz-answer lifecycle, multiplayer lifecycle: NOT RUN.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/amq_learning_tool_v82_85_30_workspace_proto25_stage09.html dist/amq_learning_tool_v82_85_30_workspace_proto25_stage09.html.sha256 engineering/proto24-acceptance
          git commit -m "Publish Proto25 stage 9 UI candidate and evidence"
          git push origin "HEAD:${TARGET_BRANCH}"
