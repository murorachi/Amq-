name: Download AMQ Proto17 HTML

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-amq-proto17
  cancel-in-progress: false

jobs:
  download:
    name: Fetch pinned Proto17 and package it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: 4fc4a099389b59850c46d3eab2332be3401d487a
      SOURCE_FILE: amq_learning_tool_v82_85_30_workspace_proto17.html
    steps:
      - name: Download exact file from the requested commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/${SOURCE_FILE}"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$url" -o "output/${SOURCE_FILE}"

          test -s "output/${SOURCE_FILE}"
          grep -qi '<!DOCTYPE html>' "output/${SOURCE_FILE}"
          grep -q 'AMQ Workspace UI Proto15' "output/${SOURCE_FILE}"

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Source commit: ${SOURCE_SHA}"
            echo "Source path: ${SOURCE_FILE}"
            echo "Downloaded UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "File size (bytes): $(wc -c < "output/${SOURCE_FILE}" | tr -d ' ')"
            echo "SHA-256:"
            sha256sum "output/${SOURCE_FILE}"
          } > output/SHA256-MANIFEST.txt

          cat output/SHA256-MANIFEST.txt

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: amq_learning_tool_v82_85_30_workspace_proto17
          path: |
            output/amq_learning_tool_v82_85_30_workspace_proto17.html
            output/SHA256-MANIFEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
