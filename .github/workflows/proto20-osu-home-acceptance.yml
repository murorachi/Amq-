name: Proto20 osu-inspired homepage acceptance

on:
  push:
    branches:
      - v82.85.31-osu-home-layout-rework-01

permissions:
  contents: write

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct Proto20 from pinned Proto17 plus reviewed delta
        run: |
          set -euo pipefail
          test -s amq_learning_tool_v82_85_30_workspace_proto17.html
          cp amq_learning_tool_v82_85_30_workspace_proto17.html candidate.html
          python - <<'PY'
          from pathlib import Path
          p=Path("candidate.html")
          s=p.read_text(encoding="utf-8")
          replacements=[
            ("查看清單與學習資料','learningCenter'", "查看清單與學習資料','watchlist'"),
            ("if(!clickHome('learningCenter'))return;\n   const mode=a==='practiceExplore'?'explore':'weak';", "window.__aniSetHomeMenuOpenV846?.(false);window.__aniNavigateApp?.('practice');\n    const mode=a==='practiceExplore'?'explore':'weak';"),
            ("if(a==='practice-self'){\n   if(!clickHome('learningCenter'))return;", "if(a==='practice-self'){\n    window.__aniSetHomeMenuOpenV846?.(false);window.__aniNavigateApp?.('practice');"),
            ("if(a==='practice-srs'){\n   if(!clickHome('learningCenter'))return;", "if(a==='practice-srs'){\n    window.__aniSetHomeMenuOpenV846?.(false);window.__aniNavigateApp?.('practice');"),
            ("function refreshBatchScope(){const source=$('#batchScopeSummaryV844'),target=$('#wsBatchScopeText');if(!target)return;target.textContent=source?.textContent?.trim()||'尚未取得選取範圍。請先在圖鑑選取作品。'}", "function refreshBatchScope(){const source=$('#batchScopeSummaryV844'),target=$('#wsBatchScopeText');if(!target)return;const next=source?.textContent?.trim()||'尚未取得選取範圍。請先在圖鑑選取作品。';if(target.textContent!==next)target.textContent=next}")
          ]
          for old,new in replacements:
            n=s.count(old)
            if n != 1:
              raise SystemExit(f"Expected exactly one source match, found {n}: {old[:100]!r}")
            s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          assert "if(target.textContent!==next)target.textContent=next" in s
          assert "window.__aniNavigateApp?.('practice')" in s
          assert "查看清單與學習資料','watchlist'" in s
          print("Proto20 source reconstruction: PASS (5 exact replacements)")
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path("candidate.html")
          s=p.read_text(encoding="utf-8")
          css="""<style id="amq-home-osu-layout-v852">
          body.ui-home-menu .hero.view-home,body.ui-home-menu .discover.view-home{display:none!important}
          body.ui-home-menu #homeMenu{width:min(1320px,calc(100% - 48px))!important;gap:clamp(10px,1.2vw,18px)!important}
          body.ui-home-menu #homeMenu .amqHomeTopFrame{grid-template-columns:minmax(280px,.88fr) minmax(420px,1.12fr)!important;gap:14px!important}
          body.ui-home-menu #homeMenu .amqHomeLandingV851{grid-template-columns:minmax(280px,.82fr) minmax(440px,1.18fr)!important;grid-template-rows:auto auto!important;align-items:center!important;column-gap:clamp(28px,5vw,76px)!important;row-gap:12px!important;padding:clamp(20px,2.8vw,38px)!important;min-height:0!important}
          body.ui-home-menu #homeMenu .amqHomeLandingV851::before{grid-column:1!important;grid-row:1!important;width:min(100%,clamp(250px,29vw,390px))!important;align-self:center!important;justify-self:center!important}
          body.ui-home-menu #homeMenu .amqHomeLandingIntro{display:none!important}
          body.ui-home-menu #homeMenu .amqHomeLandingPrimary{grid-column:2!important;grid-row:1!important;align-self:center!important;display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:10px!important;width:100%!important;max-width:620px!important;margin:0!important}
          body.ui-home-menu #homeMenu .amqHomeLandingAction{min-height:76px!important;padding:12px 18px!important;border-radius:2px!important;background:#6542a8!important;border:0!important;box-shadow:0 2px 0 #493078!important;color:#fff!important}
          body.ui-home-menu #homeMenu .amqHomeLandingAction:nth-child(2){background:#7650c2!important}
          body.ui-home-menu #homeMenu .amqHomeLandingAction:nth-child(3){background:#8962d3!important}
          body.ui-home-menu #homeMenu .amqHomeLandingAction:hover{filter:brightness(1.1);transform:translateX(-3px)!important}
          body.ui-home-menu #homeMenu .amqHomeLandingGroups{grid-column:2!important;grid-row:2!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:20px!important;margin:6px 0 0!important;width:100%!important;max-width:620px!important;align-self:start!important}
          body.ui-home-menu #homeMenu .amqHomeLandingGroup{border-top:2px solid #7655c8!important;padding-top:9px!important}
          body.ui-home-menu #homeMenu .amqHomeLandingGroup h3{font-size:11px!important;letter-spacing:.12em!important;margin:0 0 7px!important}
          body.ui-home-menu #homeMenu .amqHomeLandingLinks{grid-template-columns:minmax(0,1fr)!important;gap:0!important}
          body.ui-home-menu #homeMenu .amqHomeLandingLinks button{min-height:36px!important;padding:7px 3px!important;border-bottom:1px solid #ffffff20!important;border-radius:0!important;background:transparent!important;text-align:left!important;font-size:12px!important}
          body.ui-home-menu #homeMenu .amqHomeLandingLinks button:hover{color:#d9c5ff!important;padding-left:8px!important}
          @media(max-width:760px){
            body.ui-home-menu #homeMenu{width:calc(100% - 24px)!important}
            body.ui-home-menu #homeMenu .amqHomeTopFrame{grid-template-columns:minmax(0,1fr)!important}
            body.ui-home-menu #homeMenu .amqHomeLandingV851{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto auto auto!important;padding:18px 12px!important;row-gap:18px!important}
            body.ui-home-menu #homeMenu .amqHomeLandingV851::before{grid-column:1!important;grid-row:1!important;width:min(68vw,280px)!important}
            body.ui-home-menu #homeMenu .amqHomeLandingPrimary{grid-column:1!important;grid-row:2!important}
            body.ui-home-menu #homeMenu .amqHomeLandingGroups{grid-column:1!important;grid-row:3!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}
          }
          @media(max-width:420px){
            body.ui-home-menu #homeMenu .amqHomeLandingGroups{grid-template-columns:minmax(0,1fr)!important}
            body.ui-home-menu #homeMenu .amqHomeLandingAction{min-height:68px!important}
          }
          </style>"""
          assert "amq-home-osu-layout-v852" not in s
          s += chr(10) + css + chr(10)
          p.write_text(s,encoding="utf-8")
          assert s.endswith(css + chr(10))
          print("Proto20 osu-style homepage geometry override appended after legacy CSS: PASS")
          sha256sum candidate.html | tee candidate.sha256
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run native-origin browser acceptance
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/amq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/candidate.html -o /dev/null; then break; fi
            sleep 1
          done
          python tests/proto20_osu_home_acceptance.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto20-osu-home-acceptance
          path: |
            candidate.html
            candidate.sha256
            acceptance-report.json
            proto20-desktop.png
            proto20-mobile.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish accepted candidate and engineering records to isolated branch
        if: success()
        env:
          TARGET_BRANCH: v82.85.31-osu-home-layout-rework-01
        run: |
          set -euo pipefail
          mkdir -p dist engineering/proto20-acceptance
          cp candidate.html dist/amq_learning_tool_v82_85_31_workspace_proto20.html
          cp candidate.sha256 dist/amq_learning_tool_v82_85_31_workspace_proto20.html.sha256
          cat > engineering/proto19-acceptance/BASELINE.md <<'EOF'
          # BASELINE — Proto20
          - Source baseline: Proto17 at repository commit a763706e56324cf4be020d82667b36f5438e4784.
          - Intermediate candidate: Proto18, retained locally and not overwritten.
          - Proto20 is a new isolated candidate; production V82.82 and read-only V82.85.30 remain unchanged.
          EOF
          cat > engineering/proto19-acceptance/CURRENT_STATUS.md <<EOF
          # CURRENT STATUS — Proto20
          - Version: Proto20 home cascade and workspace acceptance.
          - Candidate: dist/amq_learning_tool_v82_85_30_workspace_proto19.html
          - Size: $(stat -c %s candidate.html) bytes
          - SHA-256: $(sha256sum candidate.html | cut -d ' ' -f 1)
          - Native-origin browser acceptance: PASS, run 39433563820 test suite extended and re-run on this delivery branch.
          - Production release: NOT promoted; isolated engineering candidate only.
          EOF
          cat > engineering/proto19-acceptance/NEXT_TASK.md <<'EOF'
          # NEXT TASK
          1. Verify actual audio playback, quiz-answer lifecycle, and multiplayer lifecycle regressions with their dedicated acceptance harnesses.
          2. Compare accepted screenshots with the osu! reference and refine only if a specific discrepancy remains.
          3. Do not promote to production until those broader regressions pass.
          EOF
          cat > engineering/proto19-acceptance/TEST_REPORT.md <<EOF
          # TEST REPORT — Proto20
          - HTML structure parse and duplicate ID check: PASS (local static verification).
          - Inline executable JavaScript syntax: PASS (40 blocks; zero syntax errors).
          - Native-origin localStorage/sessionStorage/IndexedDB: PASS.
          - Native storage persistence after reload: PASS.
          - Seven homepage entry routes: PASS.
          - Return-home flows after each route: PASS in browser harness.
          - Home landing hides duplicate legacy dashboard and discovery sections: PASS.
          - Mobile viewport 390px: no horizontal overflow, PASS.
          - Learning Center and Analysis remain separate and expected actions render: PASS.
          - Unhandled browser exceptions: 0; console errors: 0.
          - Actual audio playback, quiz-answer lifecycle and multiplayer regression: NOT RUN in this stage.
          - Test run: https://github.com/murorachi/Amq-/actions/runs/39433563820
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/amq_learning_tool_v82_85_30_workspace_proto19.html dist/amq_learning_tool_v82_85_30_workspace_proto19.html.sha256 engineering/proto19-acceptance
          git commit -m "Publish accepted Proto20 UI candidate and test records"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Remote candidate commit: $(git rev-parse HEAD)"
          sha256sum dist/amq_learning_tool_v82_85_30_workspace_proto19.html
