
name: Retrieve V82.76 source archive for engineering

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing V82.76"
        required: true
        default: "AMQ1"
        type: string
      expected_sha256:
        description: "Expected ZIP SHA-256 (optional, recommended)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retrieve-v8276-source.yml"

permissions:
  contents: read

jobs:
  retrieve-baseline:
    name: Download, verify, and export V82.76 source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download and verify V82.76 release archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: murorachi/Amq-
          RELEASE_TAG: ${{ inputs.release_tag || 'AMQ1' }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          # Validate inputs before using them.
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid release tag."
            exit 1
          fi

          if [[ -n "$EXPECTED_SHA256" ]] &&
             [[ ! "$EXPECTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Expected SHA-256 must contain 64 hex characters."
            exit 1
          fi

          # Read the specified release metadata.
          gh api \
            "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > release.json

          # Find exactly one ZIP whose filename identifies V82.76.
          python - <<'PY'
          import json
          import re
          import sys

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          pattern = re.compile(r"v82[._-]?76.*\.zip$", re.I)
          matches = [
              a for a in release.get("assets", [])
              if pattern.search(a.get("name", ""))
          ]

          if len(matches) != 1:
              print(
                  "Expected exactly one V82.76 ZIP asset; "
                  f"found {len(matches)}."
              )
              print("Release assets:")
              for asset in release.get("assets", []):
                  print(" -", asset.get("name", "(unnamed)"))
              sys.exit(1)

          asset = matches[0]
          print("Selected asset:", asset["name"])
          print("Asset size:", asset["size"])
          print("Download URL:", asset["browser_download_url"])

          with open("asset.env", "w", encoding="utf-8") as f:
              f.write("ASSET_NAME=" + asset["name"] + "\n")
              f.write("ASSET_URL=" + asset["browser_download_url"] + "\n")
              f.write("ASSET_SIZE=" + str(asset["size"]) + "\n")
          PY

          source asset.env

          # Only download from the expected repository release domain.
          case "$ASSET_URL" in
            "https://github.com/${REPOSITORY}/releases/download/"*)
              ;;
            *)
              echo "::error::Unexpected release asset URL."
              exit 1
              ;;
          esac

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ASSET_URL" \
            --output V82.76.zip

          ACTUAL_SIZE="$(stat -c %s V82.76.zip)"
          ACTUAL_SHA256="$(sha256sum V82.76.zip | cut -d ' ' -f 1)"

          printf 'Release tag:       %s\n' "$RELEASE_TAG"
          printf 'Asset name:        %s\n' "$ASSET_NAME"
          printf 'Release size:      %s\n' "$ASSET_SIZE"
          printf 'Downloaded size:   %s\n' "$ACTUAL_SIZE"
          printf 'Actual SHA-256:    %s\n' "$ACTUAL_SHA256"

          # Confirm the download matches GitHub's reported asset size.
          test "$ACTUAL_SIZE" = "$ASSET_SIZE"

          # Verify the expected hash when the operator provides one.
          if [[ -n "$EXPECTED_SHA256" ]]; then
            if [[ "${ACTUAL_SHA256,,}" != "${EXPECTED_SHA256,,}" ]]; then
              echo "::error::SHA-256 mismatch."
              exit 1
            fi
            echo "Expected SHA-256 verified."
          else
            echo "::warning::No expected SHA-256 supplied. Integrity is not independently authenticated."
          fi

          # Validate ZIP structure and CRC for every entry.
          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path("V82.76.zip")

          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()
              assert entries, "Archive is empty"

              bad = archive.testzip()
              assert bad is None, f"ZIP CRC failure: {bad}"

              print("Archive entries:", len(entries))
              for item in entries:
                  print(f"{item.file_size:>12} bytes  {item.filename}")

          print("ZIP structure and CRC validation passed.")
          PY

          printf '%s  %s\n' "$ACTUAL_SHA256" "V82.76.zip" \
            > V82.76.zip.sha256

          {
            echo "## V82.76 source archive"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Asset: \`$ASSET_NAME\`"
            echo "- Size: $ACTUAL_SIZE bytes"
            echo "- SHA-256: \`$ACTUAL_SHA256\`"
            echo "- ZIP structure and CRC: passed"
            if [[ -n "$EXPECTED_SHA256" ]]; then
              echo "- Expected SHA-256 comparison: passed"
            else
              echo "- Expected SHA-256 comparison: not performed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export verified archive for download
        uses: actions/upload-artifact@v4
        with:
          name: v82-76-source-archive
          path: |
            V82.76.zip
            V82.76.zip.sha256
          if-no-files-found: error
          retention-days: 7
