
name: Retrieve V82.76 Source Archive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the V82.76 archive"
        required: true
        default: "AMQ1"
        type: string
      expected_sha256:
        description: "Trusted expected SHA-256 hash (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  retrieve-baseline:
    name: Download and Verify V82.76
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate inputs and locate release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: murorachi/Amq-
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid release tag."
            exit 1
          fi

          if [[ -n "$EXPECTED_SHA256" ]] &&
             [[ ! "$EXPECTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::SHA-256 must contain exactly 64 hexadecimal characters."
            exit 1
          fi

          gh api \
            "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > release.json

          python - <<'PY'
          import json
          import re
          import sys

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          pattern = re.compile(
              r"(?<![A-Za-z0-9])v?82[._-]?76(?![0-9]).*\.zip$",
              re.IGNORECASE
          )

          assets = release.get("assets", [])
          matches = [
              asset for asset in assets
              if pattern.search(asset.get("name", ""))
          ]

          if len(matches) != 1:
              print(
                  f"Expected exactly one V82.76 ZIP, found {len(matches)}."
              )
              print("Available release assets:")
              for asset in assets:
                  print(" -", asset.get("name", "(unnamed)"))
              sys.exit(1)

          asset = matches[0]
          url = asset.get("browser_download_url", "")
          size = asset.get("size")

          if not isinstance(size, int) or size <= 0:
              print("Invalid asset size in release metadata.")
              sys.exit(1)

          expected_prefix = (
              "https://github.com/murorachi/Amq-/releases/download/"
          )

          if not url.startswith(expected_prefix):
              print("Unexpected release asset download URL.")
              sys.exit(1)

          with open("asset.env", "w", encoding="utf-8") as f:
              f.write("ASSET_NAME=" + json.dumps(asset["name"]) + "\n")
              f.write("ASSET_URL=" + json.dumps(url) + "\n")
              f.write("ASSET_SIZE=" + str(size) + "\n")

          print("Release:", release.get("tag_name", "unknown"))
          print("Selected asset:", asset["name"])
          print("Expected size:", size, "bytes")
          PY

      - name: Download and verify archive
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          eval "$(cat asset.env)"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ASSET_URL" \
            --output V82.76.zip

          ACTUAL_SIZE="$(stat -c %s V82.76.zip)"
          ACTUAL_SHA256="$(sha256sum V82.76.zip | cut -d ' ' -f 1)"

          echo "Asset: $ASSET_NAME"
          echo "Expected size: $ASSET_SIZE bytes"
          echo "Downloaded size: $ACTUAL_SIZE bytes"
          echo "SHA-256: $ACTUAL_SHA256"

          if [[ "$ACTUAL_SIZE" != "$ASSET_SIZE" ]]; then
            echo "::error::Downloaded size does not match release metadata."
            exit 1
          fi

          if [[ -n "$EXPECTED_SHA256" ]]; then
            if [[ "${ACTUAL_SHA256,,}" != "${EXPECTED_SHA256,,}" ]]; then
              echo "::error::SHA-256 mismatch."
              exit 1
            fi
            echo "Trusted SHA-256 comparison passed."
          else
            echo "::warning::No trusted SHA-256 supplied; authenticity is not independently verified."
          fi

          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path("V82.76.zip")

          if not zipfile.is_zipfile(path):
              raise SystemExit("Downloaded file is not a valid ZIP archive.")

          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()

              if not entries:
                  raise SystemExit("ZIP archive is empty.")

              bad_entry = archive.testzip()
              if bad_entry is not None:
                  raise SystemExit(f"ZIP CRC validation failed: {bad_entry}")

              print(f"ZIP validation passed. Entries: {len(entries)}")
              for item in entries:
                  print(f"{item.file_size:>12} bytes  {item.filename}")

          print("ZIP structure and CRC checks passed.")
          PY

          printf '%s  %s\n' \
            "$ACTUAL_SHA256" "V82.76.zip" \
            > V82.76.zip.sha256

          {
            echo "## V82.76 Archive Verification"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Asset: \`$ASSET_NAME\`"
            echo "- Size: $ACTUAL_SIZE bytes"
            echo "- SHA-256: \`$ACTUAL_SHA256\`"
            echo "- ZIP structure and CRC: passed"
            if [[ -n "$EXPECTED_SHA256" ]]; then
              echo "- Trusted SHA-256 comparison: passed"
            else
              echo "- Trusted SHA-256 comparison: not performed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: v82-76-source-archive
          path: |
            V82.76.zip
            V82.76.zip.sha256
          if-no-files-found: error
          retention-days: 7
