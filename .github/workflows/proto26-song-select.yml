name: AMQ Song Select integration and visual acceptance

on:
  pull_request:
    branches:
      - v82.85.30-proto25-ui-refactor-stage-24
  push:
    branches:
      - v82.85.30-proto26-song-select-integration-01
      - v82.85.30-proto26-in-place-workspaces-01
      - v82.85.30-proto27-song-select-visual-audit-01
      - v82.85.30-proto28-song-select-default-state-fix-01
      - v82.85.30-proto29-song-select-layout-width-01
      - v82.85.30-proto30-song-select-composition-01
      - v82.85.30-proto31-scene-background-integration-01
      - v82.85.30-proto32-song-select-reference-composition-01
      - v82.85.30-proto35-song-select-visual-correction-01
      - v82.85.30-proto35-song-select-visual-correction-01
    paths:
      - 'engineering/proto26-song-select/song-select-integration.js'
      - 'engineering/proto26-song-select/build_single_file.py'
      - 'engineering/proto26-song-select/test_source.py'
      - 'engineering/proto26-song-select/browser_acceptance.py'
      - 'engineering/proto26-song-select/visual_compare.py'
      - '.github/workflows/proto26-song-select.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proto35-song-select-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build versioned standalone HTML and run source assertions
        run: |
          set -o pipefail
          python engineering/proto26-song-select/test_source.py | tee engineering/proto26-song-select/static-test-report.txt
      - name: Install Playwright Chromium and image comparison dependency
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run browser acceptance
        run: |
          set -o pipefail
          python engineering/proto26-song-select/browser_acceptance.py | tee engineering/proto26-song-select/browser-test-report.txt
      - name: Generate matched-viewport official-reference comparison evidence
        run: |
          set -o pipefail
          python engineering/proto26-song-select/visual_compare.py | tee engineering/proto26-song-select/visual-comparison-test-report.txt
      - name: Record hashes and acceptance summary
        if: always()
        run: |
          {
            echo "Song Select candidate-25 acceptance summary"
            echo "Commit under test: $GITHUB_SHA"
            echo "Date UTC: $(date -u +%FT%TZ)"
            if [ -f dist/amq_learning_tool_v82_85_30_workspace_proto26_song_select_25.html ]; then
              wc -c dist/amq_learning_tool_v82_85_30_workspace_proto26_song_select_25.html
              sha256sum dist/amq_learning_tool_v82_85_30_workspace_proto26_song_select_25.html
            fi
            echo "--- static test report ---"
            cat engineering/proto26-song-select/static-test-report.txt 2>/dev/null || true
            echo "--- browser test report ---"
            cat engineering/proto26-song-select/browser-test-report.txt 2>/dev/null || true
            echo "--- visual comparison report ---"
            cat engineering/proto26-song-select/visual-comparison-test-report.txt 2>/dev/null || true
          } > engineering/proto26-song-select/ACCEPTANCE_REPORT.md
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto35-song-select-candidate-25
          path: |
            engineering/proto26-song-select/proto26-desktop.png
            engineering/proto26-song-select/proto26-mobile.png
            engineering/proto26-song-select/proto26-stable-reference-viewport.png
            engineering/proto26-song-select/osu-stable-song-selection-pinned.jpg
            engineering/proto26-song-select/proto26-song-select-matched-viewport.png
            engineering/proto26-song-select/proto26-song-select-default-viewport.png
            engineering/proto26-song-select/proto26-song-select-overlay.png
            engineering/proto26-song-select/proto26-song-select-pixel-diff.png
            engineering/proto26-song-select/visual-comparison-report.json
            engineering/proto26-song-select/VISUAL_COMPARISON_REPORT.md
            engineering/proto26-song-select/visual-comparison-test-report.txt
            engineering/proto26-song-select/ACCEPTANCE_REPORT.md
            engineering/proto26-song-select/*test-report.txt
            dist/amq_learning_tool_v82_85_30_workspace_proto26_song_select_25.html
          if-no-files-found: warn
          retention-days: 30
      - name: Commit generated HTML and reports only after all acceptance checks pass
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/proto26-generated
          cp dist/amq_learning_tool_v82_85_30_workspace_proto26_song_select_25.html /tmp/proto26-generated/
          cp engineering/proto26-song-select/ACCEPTANCE_REPORT.md engineering/proto26-song-select/static-test-report.txt engineering/proto26-song-select/browser-test-report.txt engineering/proto26-song-select/visual-comparison-report.json engineering/proto26-song-select/VISUAL_COMPARISON_REPORT.md engineering/proto26-song-select/visual-comparison-test-report.txt /tmp/proto26-generated/
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp /tmp/proto26-generated/amq_learning_tool_v82_85_30_workspace_proto26_song_select_25.html dist/
          cp /tmp/proto26-generated/ACCEPTANCE_REPORT.md /tmp/proto26-generated/static-test-report.txt /tmp/proto26-generated/browser-test-report.txt /tmp/proto26-generated/visual-comparison-report.json /tmp/proto26-generated/VISUAL_COMPARISON_REPORT.md /tmp/proto26-generated/visual-comparison-test-report.txt engineering/proto26-song-select/
          git add dist/amq_learning_tool_v82_85_30_workspace_proto26_song_select_25.html engineering/proto26-song-select/ACCEPTANCE_REPORT.md engineering/proto26-song-select/static-test-report.txt engineering/proto26-song-select/browser-test-report.txt engineering/proto26-song-select/visual-comparison-report.json engineering/proto26-song-select/VISUAL_COMPARISON_REPORT.md engineering/proto26-song-select/visual-comparison-test-report.txt
          if git diff --cached --quiet; then
            echo "Generated candidate and reports already match the remote checkpoint"
          else
            git commit -m "Build Proto26 candidate and record visual comparison evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
