name: Proto21 settings and multiplayer UI acceptance

on:
  push:
    branches:
      - v82.85.30-proto21-settings-multiplayer-ui-01

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct Proto21
        run: |
          set -euo pipefail
          python tools/build_proto21.py
          test -s candidate.html
          sha256sum candidate.html
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run native-origin browser acceptance
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/amq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/candidate.html -o /dev/null; then break; fi
            sleep 1
          done
          python tests/proto21_ui_acceptance.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto21-settings-multiplayer-ui
          path: |
            candidate.html
            candidate.sha256
            acceptance-report.json
            proto21-home-desktop.png
            proto21-home-mobile.png
            proto21-settings.png
          if-no-files-found: ignore
          retention-days: 14
