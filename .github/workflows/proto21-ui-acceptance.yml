name: Proto21 settings and multiplayer UI acceptance

on:
  push:
    branches:
      - v82.85.30-proto21-settings-multiplayer-ui-01

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct Proto21
        run: |
          set -euo pipefail
          cp amq_learning_tool_v82_85_30_workspace_proto17.html candidate.html
          python - <<'PY'
          from pathlib import Path
          p=Path("candidate.html")
          s=p.read_text(encoding="utf-8")
          css=Path("engineering/proto20-full-ui-rebuild/workspace-shell.css").read_text(encoding="utf-8")
          style='<style id="amq-proto20-ui-rebuild-style">\\n'+css+'\\n</style>\\n'
          assert s.count("</head>")==1
          s=s.replace("</head>",style+"</head>",1)
          needle='''    <button class="amqHomeLandingAction" type="button" data-menu-number="03" data-home-action="practiceWeak">
        <span class="amqHomeLandingActionTag">03 / REVIEW</span><strong>弱點補強</strong><small>針對不熟悉的歌曲練習</small><span class="amqHomeLandingArrow" aria-hidden="true">↗</span>
      </button>'''
          addition=needle+'''\\n      <button class="amqHomeLandingAction amqHomeLandingActionMulti" type="button" data-menu-number="04" data-home-action="multiplayer"><span class="amqHomeLandingActionTag">04 / MULTIPLAYER</span><strong>多人模式</strong><small>建立房間、輸入代碼加入好友對局</small><span class="amqHomeLandingArrow" aria-hidden="true">↗</span></button>'''
          if s.count(needle)!=1: raise SystemExit(f"landing insertion point count={s.count(needle)}")
          s=s.replace(needle,addition,1)
          s += "\\n" + Path("engineering/proto21-settings-multiplayer/settings-layer.html").read_text(encoding="utf-8")
          p.write_text(s,encoding="utf-8")
          assert 'data-home-action="multiplayer"' in s and "amqSettingsLayerV21" in s
          print("Proto21 reconstructed: PASS")
          PY
          sha256sum candidate.html | tee candidate.sha256
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run native-origin browser acceptance
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/amq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/candidate.html -o /dev/null; then break; fi
            sleep 1
          done
          python tests/proto21_ui_acceptance.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto21-settings-multiplayer-ui
          path: |
            candidate.html
            candidate.sha256
            acceptance-report.json
            proto21-home-desktop.png
            proto21-home-mobile.png
            proto21-settings.png
          if-no-files-found: ignore
          retention-days: 14
