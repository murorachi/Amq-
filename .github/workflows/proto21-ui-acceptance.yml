name: Proto21 settings and multiplayer UI acceptance

on:
  push:
    branches:
      - v82.85.30-proto21-settings-multiplayer-ui-01

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct Proto21 from pinned Proto17 and Proto20 UI shell
        run: |
          set -euo pipefail
          test -s amq_learning_tool_v82_85_30_workspace_proto17.html
          cp amq_learning_tool_v82_85_30_workspace_proto17.html candidate.html
          python - <<'PY'
          from pathlib import Path
          p=Path("candidate.html")
          s=p.read_text(encoding="utf-8")
          css=Path("engineering/proto20-full-ui-rebuild/workspace-shell.css").read_text(encoding="utf-8")
          style='<style id="amq-proto20-ui-rebuild-style">\\n'+css+'\\n</style>\\n'
          assert s.count("</head>")==1
          assert "amq-proto20-ui-rebuild-style" not in s
          s=s.replace("</head>",style+"</head>",1)
          # Add multiplayer to the osu!-inspired primary stack.
          needle='''    <button class="amqHomeLandingAction" type="button" data-menu-number="03" data-home-action="practiceWeak">
        <span class="amqHomeLandingActionTag">03 / REVIEW</span><strong>弱點補強</strong><small>針對不熟悉的歌曲練習</small><span class="amqHomeLandingArrow" aria-hidden="true">↗</span>
      </button>'''
          addition=needle+'''\\n      <button class="amqHomeLandingAction amqHomeLandingActionMulti" type="button" data-menu-number="04" data-home-action="multiplayer"><span class="amqHomeLandingActionTag">04 / MULTIPLAYER</span><strong>多人模式</strong><small>建立房間、輸入代碼加入好友對局</small><span class="amqHomeLandingArrow" aria-hidden="true">↗</span></button>'''
          if s.count(needle)!=1: raise SystemExit(f"Expected 1 landing menu insertion point, found {s.count(needle)}")
          s=s.replace(needle,addition,1)
          p.write_text(s,encoding="utf-8")
          print("Proto20 shell plus multiplayer landing entry: PASS")
          PY
          cat > /tmp/proto21-layer.html <<'EOF'
          <script id="amq-proto21-settings-layer-and-multiplayer-entry">
          (()=>{const install=()=>{if(document.getElementById('amqSettingsLayerV21'))return;const root=document.createElement('section');root.id='amqSettingsLayerV21';root.className='amqSettingsLayerV21';root.hidden=true;root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-labelledby','amqSettingsTitleV21');root.innerHTML=`<div class="amqSettingsScrimV21" data-settings-close></div><div class="amqSettingsPanelV21" role="document"><header class="amqSettingsHeaderV21"><div><div class="amqSettingsEyebrowV21">OPTIONS / PREFERENCES</div><h2 id="amqSettingsTitleV21">設定</h2><p>介面、練習與資料管理。每個操作仍使用原本的設定與保存機制。</p></div><button type="button" class="btn" data-settings-close aria-label="關閉設定">關閉 ✕</button></header><div class="amqSettingsGridV21"><section class="amqSettingsGroupV21"><div class="amqSettingsGroupIconV21">◈</div><div><h3>介面與外觀</h3><p>調整色彩主題及不同場景的背景。</p><div class="amqSettingsActionsV21"><button type="button" class="btn" data-settings-action="theme">切換亮／暗模式</button><button type="button" class="btn" data-settings-action="scene">場景背景</button></div></div></section><section class="amqSettingsGroupV21"><div class="amqSettingsGroupIconV21">♫</div><div><h3>猜歌與練習</h3><p>前往原有猜歌頁，調整歌曲範圍、答題目標與回合設定。</p><div class="amqSettingsActionsV21"><button type="button" class="btn primary" data-settings-action="quiz">開啟猜歌設定</button><button type="button" class="btn" data-settings-action="practice">學習中心</button></div></div></section><section class="amqSettingsGroupV21"><div class="amqSettingsGroupIconV21">⇄</div><div><h3>多人模式</h3><p>建立多人房間、加入現有房間或重新連線。</p><div class="amqSettingsActionsV21"><button type="button" class="btn primary" data-settings-action="multiplayer">開啟多人模式</button></div></div></section><section class="amqSettingsGroupV21"><div class="amqSettingsGroupIconV21">▤</div><div><h3>資料與備份</h3><p>更新曲庫或匯出、匯入完整個人資料備份。</p><div class="amqSettingsActionsV21"><button type="button" class="btn" data-settings-action="update">更新資料庫</button><button type="button" class="btn" data-settings-action="export">匯出完整備份</button><button type="button" class="btn" data-settings-action="import">匯入／還原備份</button></div></div></section></div><footer class="amqSettingsFooterV21"><span>設定不會自動清除既有收藏、學習紀錄或房間資料。</span><button type="button" class="btn" data-settings-close>返回</button></footer></div>`;document.body.appendChild(root);const trigger=document.getElementById('uiHomeSettings');const open=()=>{root.hidden=false;document.body.classList.add('amq-settings-layer-open-v21');trigger?.setAttribute('aria-expanded','true');root.querySelector('[data-settings-close]')?.focus({preventScroll:true})};const close=()=>{root.hidden=true;document.body.classList.remove('amq-settings-layer-open-v21');trigger?.setAttribute('aria-expanded','false');trigger?.focus({preventScroll:true})};trigger?.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();root.hidden?open():close()},true);root.addEventListener('click',e=>{if(e.target.closest('[data-settings-close]')){close();return}const b=e.target.closest('[data-settings-action]');if(!b)return;const action=b.dataset.settingsAction;close();const click=id=>document.getElementById(id)?.click();if(action==='theme')return click('themeToggle');if(action==='scene')return click('sceneBackgroundOpen');if(action==='update')return click('updateBtn');if(action==='export')return click('exportBtn');if(action==='import')return click('importBtn');if(action==='quiz'){window.__aniNavigateApp?.('quiz');setTimeout(()=>{(document.getElementById('quizSettingsToggleV30')||document.getElementById('quizSettingsToggle'))?.click()},80);return}if(action==='practice')return window.__aniNavigateApp?.('practice');if(action==='multiplayer')return window.__aniNavigateApp?.('multiplayer')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!root.hidden)close()})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install()})();</script>
          <style id="amq-proto21-settings-layer-style">
          .amqSettingsLayerV21[hidden]{display:none!important}.amqSettingsLayerV21{position:fixed;z-index:100000;inset:0;display:grid;place-items:center;padding:clamp(12px,3vw,30px);color:var(--text-primary,#f6f2fa)}.amqSettingsScrimV21{position:absolute;inset:0;background:rgba(8,6,13,.78);backdrop-filter:blur(8px)}.amqSettingsPanelV21{position:relative;z-index:1;width:min(900px,100%);max-height:min(820px,calc(100dvh - 24px));overflow:auto;border:1px solid var(--border,rgba(255,255,255,.16));border-radius:14px;background:var(--surface,#211d27);box-shadow:0 28px 100px rgba(0,0,0,.55);padding:clamp(18px,3vw,30px)}.amqSettingsHeaderV21{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--border,rgba(255,255,255,.13))}.amqSettingsEyebrowV21{font-size:10px;letter-spacing:.17em;font-weight:850;color:var(--primary,#a58be8)}.amqSettingsHeaderV21 h2{font-size:clamp(25px,4vw,34px);margin:5px 0}.amqSettingsHeaderV21 p,.amqSettingsGroupV21 p{color:var(--text-secondary,#bcb4c6);font-size:12px;line-height:1.65;margin:0;max-width:600px}.amqSettingsGridV21{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px 0}.amqSettingsGroupV21{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;min-width:0;padding:17px;border:1px solid var(--border,rgba(255,255,255,.13));border-radius:10px;background:var(--surface-muted,rgba(255,255,255,.025))}.amqSettingsGroupIconV21{display:grid;place-items:center;width:38px;height:38px;border:1px solid color-mix(in srgb,var(--primary,#a58be8) 50%,transparent);border-radius:9px;color:var(--primary,#a58be8);font-size:19px}.amqSettingsGroupV21 h3{font-size:15px;margin:1px 0 6px}.amqSettingsActionsV21{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.amqSettingsActionsV21 .btn{font-size:12px;min-height:35px}.amqSettingsFooterV21{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid var(--border,rgba(255,255,255,.13));padding-top:16px;color:var(--text-secondary,#bcb4c6);font-size:11px}body.amq-settings-layer-open-v21{overflow:hidden}body.ui-home-menu #homeMenu .amqHomeLandingActionMulti{background:#49347c;border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 -3px 0 rgba(20,10,38,.18)}body.ui-home-menu #homeMenu .amqHomeLandingActionMulti:hover{background:#6548a6}body.ui-home-menu #homeMenu .amqHomeLandingPrimary{gap:8px!important}body.ui-home-menu #homeMenu .amqHomeLandingAction{min-height:70px!important;padding:10px 18px!important}@media(max-width:760px){.amqSettingsGridV21{grid-template-columns:minmax(0,1fr)}.amqSettingsPanelV21{padding:16px}.amqSettingsGroupV21{padding:13px}.amqSettingsFooterV21{align-items:flex-start;flex-direction:column}.amqSettingsHeaderV21{gap:10px}.amqSettingsHeaderV21 h2{font-size:26px}}</style>
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path("candidate.html")
          s=p.read_text(encoding="utf-8")
          block=Path("/tmp/proto21-layer.html").read_text(encoding="utf-8")
          assert s.count("</html>")==1
          assert "amqSettingsLayerV21" not in s
          s=s.replace("</html>",block+"\\n</html>",1)
          p.write_text(s,encoding="utf-8")
          assert 'data-home-action="multiplayer"' in s and "amqSettingsLayerV21" in s
          print("Proto21 settings layer and multiplayer entry inserted: PASS")
          PY
          sha256sum candidate.html | tee candidate.sha256
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run native-origin browser acceptance
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/amq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/candidate.html -o /dev/null; then break; fi
            sleep 1
          done
          python tests/proto21_ui_acceptance.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto21-settings-multiplayer-ui
          path: |
            candidate.html
            candidate.sha256
            acceptance-report.json
            proto21-home-desktop.png
            proto21-home-mobile.png
            proto21-settings.png
          if-no-files-found: ignore
          retention-days: 14
